<!doctype html>
<!--
  Wallpaper gallery: every landscape set, animated by the live page in any weather and time
  of day. Built by `wallpaper.py --gallery` into
  ~/Pictures/wallpaperscript/gallery/ next to data.js and thumbs/.
  Every choice is a link (#set=…&weather=…&phase=…); ← → step through the sets.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallpaper gallery</title>
<style>
  :root { --bg: #111214; --panel: #1b1c1f; --line: #2c2d31; --text: #e8e6e3; --dim: #8d8b88; --accent: #f0a04a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  header, main { max-width: 1600px; margin: 0 auto; padding: 0 20px; }
  header { display: flex; align-items: baseline; gap: 16px; padding-top: 18px; padding-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 28px 0 10px; font-weight: 600; }
  .dim { color: var(--dim); }
  #viewer { position: relative; width: 100%; aspect-ratio: 2.4; background: #000; border-radius: 10px; overflow: hidden; }
  #viewer iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
  #caption { display: flex; justify-content: space-between; gap: 12px; margin: 10px 0 4px; }
  #caption a { color: var(--accent); text-decoration: none; white-space: nowrap; }
  #caption .links { display: flex; gap: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
  .row .label { width: 64px; color: var(--dim); font-size: 12px; }
  .chip { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
          color: var(--text); text-decoration: none; font-size: 13px; }
  .chip:hover { border-color: var(--dim); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #1a1206; font-weight: 600; }
  .chip.off { opacity: .35; pointer-events: none; }
  .sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { display: block; background: var(--panel); border: 2px solid transparent; border-radius: 10px; overflow: hidden;
          color: inherit; text-decoration: none; }
  .card:hover { border-color: var(--line); }
  .card.on { border-color: var(--accent); }
  .card img { display: block; width: 100%; aspect-ratio: 2.4; object-fit: cover; }
  .card div { padding: 8px 10px; }
  .card b { font-weight: 600; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--line); margin-left: 6px; }
  .card p { margin: 3px 0 0; color: var(--dim); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden; }
  .sets { padding-bottom: 40px; }
  @media (max-width: 600px) { header, main { padding: 0 12px; } .row .label { width: 100%; } }
</style>
</head>
<body>
<header><h1>Wallpapers</h1><span class="dim" id="count"></span><span class="dim">← → to step through</span></header>
<main>
  <div id="viewer"></div>
  <div id="caption"><span id="what"></span><span class="links"><a id="use" title="Show this landscape on the desktop for the rest of today (weather and time stay live)">Use today</a><a id="full" target="_blank">Open full screen ↗</a></span></div>
  <div class="row" id="weather"><span class="label">Weather</span></div>
  <div class="row" id="phase"><span class="label">Time</span></div>
  <h2>Sets</h2>
  <div class="sets" id="sets"></div>
</main>
<script src="data.js"></script>
<script>
"use strict";
const G = window.GALLERY;
const WEATHERS = ["live", "clear", "overcast", "fog", "rain", "sleet", "snow", "windy", "thunder", "storm", "blizzard", "aurora"];
const PHASES = ["now", "dawn", "day", "golden", "night"];
const PLACE = G.place || "home";
const PHASE_NAMES = { now: `Now (${PLACE} sun)`, dawn: "Dawn", day: "Day", golden: "Sunset", night: "Night" };
const setKeys = Object.keys(G.sets);

function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  return { set: h.get("set"), weather: h.get("weather") || "live", phase: h.get("phase") || "now" };
}
function hashFor(s) {
  const h = new URLSearchParams({ set: s.set });
  if (s.weather !== "live") h.set("weather", s.weather);
  if (s.phase !== "now") h.set("phase", s.phase);
  return "#" + h.toString();
}

const el = id => document.getElementById(id);
el("count").textContent = `${setKeys.length} sets`;
el("sets").innerHTML = setKeys.map(k => {
  const s = G.sets[k];
  return `<a class="card" data-set="${k}" title="${s.feature}"><img src="${s.thumb}" loading="lazy" alt=""><div><b>${k}</b>` +
         [s.terrain, s.look].filter(Boolean).map(b => `<span class="badge">${b}</span>`).join("") + `</div></a>`;
}).join("");
WEATHERS.forEach(w => el("weather").insertAdjacentHTML("beforeend", `<a class="chip" data-weather="${w}">${w === "live" ? `Live (${PLACE} now)` : w}</a>`));
PHASES.forEach(p => el("phase").insertAdjacentHTML("beforeend", `<a class="chip" data-phase="${p}">${PHASE_NAMES[p]}</a>`));

let shown = "";
function render() {
  const s = readHash();
  if (!G.sets[s.set]) s.set = setKeys[0];
  // Every choice is a real link: cards keep the weather and time, chips keep the set.
  document.querySelectorAll("[data-set]").forEach(a => {
    a.href = hashFor({ ...s, set: a.dataset.set });
    a.classList.toggle("on", a.dataset.set === s.set);
  });
  document.querySelectorAll("[data-weather]").forEach(a => {
    a.href = hashFor({ ...s, weather: a.dataset.weather });
    a.classList.toggle("on", a.dataset.weather === s.weather);
  });
  document.querySelectorAll("[data-phase]").forEach(a => {
    a.href = hashFor({ ...s, phase: a.dataset.phase });
    a.classList.toggle("on", a.dataset.phase === s.phase);
  });

  const src = `../live/index.html?${hashFor(s).slice(1)}`;
  const g = G.sets[s.set];
  el("what").textContent = [s.set, g.terrain, g.look, s.weather === "live" ? "live weather" : s.weather,
                            PHASE_NAMES[s.phase]].filter(Boolean).join(" · ");
  el("full").href = src;
  el("use").href = `dotfiles-wallpaper://show/${encodeURIComponent(s.set)}`;
  if (src !== shown) {
    shown = src;
    el("viewer").innerHTML = `<iframe src="${src}"></iframe>`;
  }
  return s;
}

window.addEventListener("hashchange", render);
window.addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const s = render();
  const i = setKeys.indexOf(s.set), n = setKeys.length;
  location.hash = hashFor({ ...s, set: setKeys[(i + (e.key === "ArrowRight" ? 1 : -1) + n) % n] });
});
render();
</script>
</body>
</html>
