<!doctype html>
<!--
  Live wallpaper: today's landscape set from wallpaper.py, cross-faded by Oslo's sun,
  with drifting clouds and mist, a breathing sun/moon glow, birds and twinkling stars,
  and Oslo's current weather: rain, snow, sleet, fog, overcast, wind and thunder.

  wallpaper.py copies this page to ~/Pictures/wallpaperscript/live/ next to state.js
  and the images; point Plash at that copy.

  URL options (for previewing):  ?at=07:30  start at that time today
                                 ?speed=600 run the clock 600x faster
                                 ?debug=1   show the detected skyline and the clock
                                 ?weather=rain  try a weather: clear, overcast, fog, rain, snow,
                                            sleet, windy, thunder, storm, blizzard
                                            (&intensity=0..1, &wind=-15..15 m/s, + blows right)
                                 ?phase=night  hold one palette: dawn, day, golden, night
                                 ?set=2026-W42  show another set (needs wallpaper.py --gallery,
                                            which writes ../gallery/data.js)
-->
<html>
<head>
<meta charset="utf-8">
<title>Live wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a1e; }
  .layer { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 10; }
  #flash { position: fixed; inset: 0; z-index: 9; background: #c9d2ff; opacity: 0; pointer-events: none;
           mix-blend-mode: screen; }
  #debug { position: fixed; z-index: 11; left: 12px; bottom: 12px; font: 13px ui-monospace, monospace;
           color: #fff; background: #0008; padding: 6px 10px; border-radius: 6px; display: none; }
</style>
</head>
<body>
<img class="layer" id="dawn" alt=""><img class="layer" id="day" alt="">
<img class="layer" id="golden" alt=""><img class="layer" id="night" alt="">
<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="debug"></div>
<script>
"use strict";
const PHASES = ["dawn", "day", "golden", "night"];
// How strongly each effect shows in each phase; the current blend mixes these.
const LOOK = {
  dawn:   { glow: 0.45, rays: 0.10, stars: 0.0, mist: 0.55, clouds: 0.45, birds: 1 },
  day:    { glow: 0.45, rays: 0.12, stars: 0.0, mist: 0.25, clouds: 0.40, birds: 1 },
  golden: { glow: 0.65, rays: 0.18, stars: 0.0, mist: 0.35, clouds: 0.45, birds: 1 },
  night:  { glow: 0.35, rays: 0.0,  stars: 1.0, mist: 0.30, clouds: 0.22, birds: 0 },
};

const params = new URLSearchParams(location.search);
const speed = Number(params.get("speed") || 1);
const debug = params.has("debug");
const fpsCap = Number(params.get("fps") || 30);
const startReal = Date.now();
let startClock = startReal;
if (params.get("at")) {
  const [h, m] = params.get("at").split(":").map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0); startClock = d.getTime();
}
const clock = () => startClock + (Date.now() - startReal) * speed;

// Weather presets for ?weather= (the real weather comes from state.js, fetched from MET Norway).
const WEATHER_PRESETS = {
  clear:    { clouds: 0 },
  overcast: { clouds: 1, wind_x: 3 },
  fog:      { clouds: 1, fog: 1 },
  rain:     { clouds: 1, kind: "rain", intensity: 0.6, wind_x: 3 },
  snow:     { clouds: 1, kind: "snow", intensity: 0.6, wind_x: 1.5 },
  sleet:    { clouds: 1, kind: "sleet", intensity: 0.6, wind_x: 3 },
  windy:    { clouds: 0.55, wind_x: 13 },
  thunder:  { clouds: 1, kind: "rain", intensity: 0.45, wind_x: 5, thunder: true },
  storm:    { clouds: 1, kind: "rain", intensity: 1, wind_x: 12, thunder: true },
  blizzard: { clouds: 1, kind: "snow", intensity: 1, wind_x: 12, fog: 0.5 },
};
function currentWeather() {
  const preset = WEATHER_PRESETS[params.get("weather")];
  const w = { clouds: 0.3, fog: 0, kind: null, intensity: 0, wind_x: 2, thunder: false,
              ...(preset || (W && W.weather) || {}) };
  if (params.get("intensity")) w.intensity = Number(params.get("intensity"));
  if (params.get("wind")) w.wind_x = Number(params.get("wind"));
  return w;
}

// --- state from wallpaper.py ----------------------------------------------------

let W = null;          // window.WALLPAPER from state.js
let loadedSet = null;

function loadState() {
  const s = document.createElement("script");
  s.src = `state.js?${Date.now()}`;
  s.onload = () => {
    s.remove();
    W = window.WALLPAPER;
    const g = window.GALLERY && window.GALLERY.sets[params.get("set")];
    if (g) W = { ...W, set: params.get("set"), images: g.images, scene: g.scene, look: g.look };
    if (W.set !== loadedSet) useSet();
  };
  s.onerror = () => s.remove();
  document.head.appendChild(s);
}

function useSet() {
  loadedSet = W.set;
  for (const p of PHASES) document.getElementById(p).src = W.images[p];
  buildSky();
}

// Same fade as wallpaper.py's blend_at, but continuous.
function blendAt(ms) {
  for (const keys of W.anchors) {
    for (let i = 0; i + 1 < keys.length; i++) {
      const [t0, a] = keys[i], [t1, b] = keys[i + 1];
      if (t0 <= ms && ms < t1) {
        if (a === b) return [a, a, 0];
        const x = (ms - t0) / (t1 - t0);
        return [a, b, x * x * (3 - 2 * x)];
      }
    }
  }
  return ["night", "night", 0];
}

// --- canvas & geometry ------------------------------------------------------------

const cv = document.getElementById("fx");
const ctx = cv.getContext("2d");
let Wd = 0, Ht = 0, dpr = 1;
let img = { scale: 1, ox: 0, oy: 0, w: 1, h: 1 };  // object-fit: cover mapping
let skyPath = null;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  Wd = cv.width = Math.round(innerWidth * dpr);
  Ht = cv.height = Math.round(innerHeight * dpr);
  const el = document.getElementById("day");
  const iw = el.naturalWidth || Wd, ih = el.naturalHeight || Ht;
  const scale = Math.max(Wd / iw, Ht / ih);
  img = { scale, w: iw * scale, h: ih * scale, ox: (Wd - iw * scale) / 2, oy: (Ht - ih * scale) / 2 };
  buildSky();
  seedStars();
}
const X = fx => img.ox + fx * img.w;
const Y = fy => img.oy + fy * img.h;
const U = () => img.w / 3840;  // 1 unit = 1px on the 3840-wide ultrawide

function skyAt(fx) {
  const line = W.scene.skyline;
  const i = Math.max(0, Math.min(line.length - 1, fx * line.length));
  const a = line[Math.floor(i)], b = line[Math.min(line.length - 1, Math.ceil(i))];
  return a + (b - a) * (i % 1);
}

function buildSky() {
  if (!W) return;
  const line = W.scene.skyline;
  skyPath = new Path2D();
  skyPath.moveTo(X(0), Y(0));
  line.forEach((v, i) => skyPath.lineTo(X((i + 0.5) / line.length), Y(v)));
  skyPath.lineTo(X(1), Y(line[line.length - 1]));
  skyPath.lineTo(X(1), Y(0));
  skyPath.closePath();
}

// --- helpers ------------------------------------------------------------------------

const rnd = (a, b) => a + Math.random() * (b - a);
const mix = (a, b, t) => a + (b - a) * t;
const mixRGB = (a, b, t) => a.map((v, i) => Math.round(mix(v, b[i], t)));
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const lighten = (c, t) => mixRGB(c, [255, 255, 255], t);
const darken = (c, t) => mixRGB(c, [0, 0, 0], t);

function sprite(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
  draw(c.getContext("2d"), c.width, c.height);
  return c;
}

// --- clouds: long thin flat streaks in the Firewatch style ---------------------------

let clouds = [];
function makeCloud(x, heavy = 0) {
  const len = rnd(500, 1400) * (1 + heavy * 0.6), th = rnd(8, 22) * (1 + heavy * 1.8);
  return {
    x: x ?? rnd(-0.3, 1), y: rnd(0.04, 0.34 + heavy * 0.08), len, th, heavy,
    speed: rnd(3, 9),                       // units per second
    alpha: rnd(0.35, 0.8),
    strands: Array.from({ length: 1 + Math.floor(rnd(1, 4)) }, (_, i) => ({
      dx: rnd(-0.25, 0.35) * len, dy: i * th * rnd(1.4, 2.2), l: len * rnd(0.35, 0.9), t: th * rnd(0.5, 1),
    })),
  };
}
function drawClouds(colour, strength, dt, wx) {
  const u = U();
  // More and thicker clouds the more overcast it is; they drift with the wind.
  const want = Math.round(7 + 9 * wx.clouds);
  while (clouds.length < want) clouds.push(makeCloud(undefined, wx.clouds));
  if (clouds.length > want) clouds.length = want;
  const dir = wx.wind_x < 0 ? -1 : 1, push = 1 + Math.abs(wx.blow) / 2.5;
  ctx.fillStyle = rgba(colour, 1);
  for (const c of clouds) {
    c.x += (dir * c.speed * push * u * dt) / img.w;
    const span = (c.len * 1.6 * u) / img.w;
    if (dir > 0 && c.x > 1 + span) Object.assign(c, makeCloud(-span, wx.clouds));
    if (dir < 0 && c.x < -span) Object.assign(c, makeCloud(1 + span * 0.2, wx.clouds));
    ctx.globalAlpha = strength * c.alpha;
    for (const s of c.strands) {
      const x = X(c.x) + s.dx * u, y = Y(c.y) + s.dy * u;
      ctx.beginPath();
      ctx.roundRect(x, y, s.l * u, s.t * u, s.t * u / 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// --- mist: soft bands drifting through the valleys -----------------------------------

let mistSprite = null, mistColour = null;
const mistBands = [
  { dy: 0.04, h: 0.10, speed: 6, off: 0, phase: 0 },
  { dy: 0.13, h: 0.12, speed: -4, off: 0.4, phase: 2 },
  { dy: 0.24, h: 0.14, speed: 9, off: 0.7, phase: 4 },
];
function buildMist(colour) {
  mistColour = colour.join();
  mistSprite = sprite(1200, 240, (g, w, h) => {
    for (let i = 0; i < 90; i++) {
      const x = rnd(0, w), y = rnd(h * 0.3, h * 0.7), r = rnd(40, 140);
      for (const dx of [-w, 0, w]) {  // wrap so the sprite tiles seamlessly
        const grad = g.createRadialGradient(x + dx, y, 0, x + dx, y, r);
        grad.addColorStop(0, rgba(colour, 0.10));
        grad.addColorStop(1, rgba(colour, 0));
        g.fillStyle = grad;
        g.beginPath(); g.ellipse(x + dx, y, r * 2.2, r * 0.6, 0, 0, Math.PI * 2); g.fill();
      }
    }
  });
}
let mistTime = 0;  // advances faster in wind
function drawMist(colour, strength, now) {
  if (strength <= 0.01) return;
  if (colour.join() !== mistColour) buildMist(colour);
  const base = W.scene.skyline.reduce((a, b) => a + b) / W.scene.skyline.length;
  const u = U(), tw = mistSprite.width * u * 3;
  for (const b of mistBands) {
    const h = b.h * img.h, y = Y(base + b.dy) - h / 2;
    const shift = ((mistTime * b.speed * u + b.off * tw) % tw + tw) % tw;
    ctx.globalAlpha = strength * (0.75 + 0.25 * Math.sin(now / 9000 + b.phase));
    for (let x = -shift; x < Wd; x += tw) ctx.drawImage(mistSprite, x, y, tw, h);
  }
  ctx.globalAlpha = 1;
}

// --- sun / moon glow and rays ---------------------------------------------------------

function drawGlow(sun, colour, glow, rays, now) {
  const [fx, fy, fr] = sun;
  const x = X(fx), y = Y(fy), r = fr * img.w;
  ctx.globalCompositeOperation = "screen";
  const pulse = 0.85 + 0.15 * Math.sin(now / 5000);
  const g = ctx.createRadialGradient(x, y, r * 0.8, x, y, r * 7);
  g.addColorStop(0, rgba(colour, glow * pulse));
  g.addColorStop(0.35, rgba(colour, glow * pulse * 0.25));
  g.addColorStop(1, rgba(colour, 0));
  ctx.fillStyle = g;
  ctx.fillRect(x - r * 7, y - r * 7, r * 14, r * 14);
  if (rays > 0.01) {
    // Drawn small and scaled up, so the wedges get soft edges for free.
    const q = 8, len = img.w * 0.45, spin = now / 120000;
    if (!raysCanvas || raysCanvas.width !== Math.ceil(Wd / q)) {
      raysCanvas = document.createElement("canvas");
      raysCanvas.width = Math.ceil(Wd / q); raysCanvas.height = Math.ceil(Ht / q);
    }
    const g2 = raysCanvas.getContext("2d"), sx = x / q, sy = y / q;
    g2.clearRect(0, 0, raysCanvas.width, raysCanvas.height);
    const rg = g2.createRadialGradient(sx, sy, r / q, sx, sy, len / q);
    rg.addColorStop(0, rgba(colour, rays));
    rg.addColorStop(1, rgba(colour, 0));
    g2.fillStyle = rg;
    g2.filter = "blur(3px)";
    for (let i = 0; i < 14; i++) {
      const a = spin + (i / 14) * Math.PI * 2, wdt = 0.03 + 0.02 * Math.sin(i * 7.3 + now / 7000);
      g2.beginPath(); g2.moveTo(sx, sy);
      g2.arc(sx, sy, len / q, a - wdt, a + wdt);
      g2.closePath(); g2.fill();
    }
    ctx.drawImage(raysCanvas, 0, 0, Wd, Ht);
  }
  ctx.globalCompositeOperation = "source-over";
}

// --- stars & shooting stars ------------------------------------------------------------

let stars = [], shooting = null, nextShooting = 0;
let raysCanvas = null;
function seedStars() {
  if (!W) return;
  stars = [];
  for (let i = 0; i < 260; i++) {
    const fx = Math.random();
    const fy = rnd(0.01, skyAt(fx) - 0.03);
    if (fy > 0.01) stars.push({ fx, fy, r: rnd(0.5, 1.6), sp: rnd(0.4, 1.6), ph: rnd(0, 6.3) });
  }
}
function drawStars(strength, now) {
  if (strength <= 0.01) return;
  const u = U();
  ctx.fillStyle = "#fff";
  for (const s of stars) {
    ctx.globalAlpha = strength * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(now / 1000 * s.sp + s.ph)));
    ctx.beginPath(); ctx.arc(X(s.fx), Y(s.fy), s.r * u * 1.4, 0, Math.PI * 2); ctx.fill();
  }
  if (!shooting && now > nextShooting) {
    if (nextShooting) shooting = { x: rnd(0.1, 0.8), y: rnd(0.03, 0.18), a: rnd(0.25, 0.6), t: 0 };
    nextShooting = now + rnd(45000, 150000);
  }
  if (shooting) {
    shooting.t += 1 / 40;
    const p = shooting.t, len = 260 * u;
    const x = X(shooting.x) + p * 900 * u * Math.cos(shooting.a), y = Y(shooting.y) + p * 900 * u * Math.sin(shooting.a);
    const g = ctx.createLinearGradient(x, y, x - len * Math.cos(shooting.a), y - len * Math.sin(shooting.a));
    g.addColorStop(0, `rgba(255,255,255,${strength * (1 - p)})`);
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.globalAlpha = 1; ctx.strokeStyle = g; ctx.lineWidth = 2 * u;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - len * Math.cos(shooting.a), y - len * Math.sin(shooting.a)); ctx.stroke();
    if (p >= 1) shooting = null;
  }
  ctx.globalAlpha = 1;
}

// --- birds: a loose flock crossing now and then -----------------------------------------

let flock = null, nextFlock = 0;
function spawnFlock(now) {
  const dir = Math.random() < 0.5 ? 1 : -1, n = Math.floor(rnd(5, 13));
  flock = {
    dir, x: dir > 0 ? -0.05 : 1.05, y: rnd(0.12, 0.32), speed: rnd(45, 75),
    birds: Array.from({ length: n }, (_, i) => ({
      dx: -dir * (i * rnd(18, 34) + rnd(0, 20)), dy: (i % 2 ? 1 : -1) * i * rnd(5, 12) + rnd(-10, 10),
      size: rnd(7, 12), flap: rnd(7, 10), ph: rnd(0, 6.3), bob: rnd(0, 6.3),
    })),
  };
}
function drawBirds(colour, strength, now, dt) {
  if (!flock && strength > 0.5 && now > nextFlock) {
    if (nextFlock) spawnFlock(now);
    nextFlock = now + rnd(40000, 120000);
  }
  if (!flock) return;
  const u = U();
  flock.x += (flock.dir * flock.speed * u * dt) / img.w;
  flock.y += Math.sin(now / 3000) * 0.00004;
  ctx.strokeStyle = rgba(colour, 0.85 * Math.max(strength, 0.3));
  ctx.lineWidth = 1.6 * u; ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const b of flock.birds) {
    const x = X(flock.x) + b.dx * u, y = Y(flock.y) + (b.dy + 4 * Math.sin(now / 900 + b.bob)) * u;
    const s = b.size * u, wing = Math.sin(now / 1000 * b.flap + b.ph) * s * 0.55;
    ctx.beginPath();
    ctx.moveTo(x - s, y - wing);
    ctx.quadraticCurveTo(x - s * 0.45, y - wing * 0.2 - s * 0.15, x, y + s * 0.12);
    ctx.quadraticCurveTo(x + s * 0.45, y - wing * 0.2 - s * 0.15, x + s, y - wing);
    ctx.stroke();
  }
  const out = flock.dir > 0 ? flock.x > 1.15 : flock.x < -0.15;
  if (out) flock = null;
}

// --- weather: rain, snow, fog, lightning ----------------------------------------------

let drops = [];
function makeDrop(wx, anywhere) {
  const snow = wx.kind === "snow" || (wx.kind === "sleet" && Math.random() < 0.5);
  return { snow, x: Math.random(), y: anywhere ? Math.random() : -0.05, z: rnd(0.3, 1), ph: rnd(0, 6.3), f: rnd(0.4, 1.2) };
}
function drawPrecip(colour, wx, dt, now) {
  const want = wx.kind ? Math.round((wx.kind === "rain" ? 200 : 140) + 700 * wx.intensity) : 0;
  while (drops.length < want) drops.push(makeDrop(wx, true));
  if (drops.length > want) drops.length = want;
  if (!want) return;
  const u = U(), wind = wx.blow;
  // Gusts sweep through the rain as denser curtains moving with the wind.
  const curtain = Math.min(1, Math.abs(wx.wind_x) / 10), wave = now / 1000 * (0.3 + Math.abs(wind) * 0.05) * Math.sign(wind || 1);
  ctx.lineCap = "round";
  for (const d of drops) {
    let vx, vy;
    if (d.snow) {  // slow, swaying flakes
      vy = (40 + 60 * d.z) * u;
      vx = wind * 14 * u * d.z + Math.sin(now / 1000 * d.f + d.ph) * 18 * u;
    } else {       // fast streaks, slanted by the wind
      vy = (1100 + 700 * d.z) * u;
      vx = wind * 45 * u;
    }
    d.x += (vx * dt) / Wd; d.y += (vy * dt) / Ht;
    if (d.y > 1.02) Object.assign(d, makeDrop(wx, false));
    if (d.x < -0.05) d.x += 1.1; else if (d.x > 1.05) d.x -= 1.1;
    const x = d.x * Wd, y = d.y * Ht;
    if (d.snow) {
      ctx.globalAlpha = 0.45 + 0.45 * d.z;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(x, y, (1.4 + 2.6 * d.z) * u, 0, Math.PI * 2); ctx.fill();
    } else {
      const len = (30 + 40 * d.z) * u / vy;
      ctx.globalAlpha = (0.12 + 0.22 * d.z) * (1 - curtain * 0.6 * (0.5 + 0.5 * Math.sin(d.x * 9 - wave * 6)));
      ctx.strokeStyle = rgba(colour, 1); ctx.lineWidth = (0.8 + 0.9 * d.z) * u;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - vx * len, y - vy * len); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

// A grey cloud deck over the sky when overcast, so the painted sun or moon doesn't blaze through.
function drawVeil(colour, amount) {
  if (amount <= 0.01) return;
  const g = ctx.createLinearGradient(0, 0, 0, Y(0.62));
  g.addColorStop(0, rgba(colour, 0.55 * amount));
  g.addColorStop(0.6, rgba(colour, 0.4 * amount));
  g.addColorStop(1, rgba(colour, 0));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, Wd, Y(0.62));
}

function drawFog(colour, amount) {
  if (amount <= 0.01) return;
  const g = ctx.createLinearGradient(0, Ht * 0.15, 0, Ht);
  g.addColorStop(0, rgba(colour, 0));
  g.addColorStop(0.45, rgba(colour, 0.45 * amount));
  g.addColorStop(1, rgba(colour, 0.65 * amount));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, Wd, Ht);
}

// --- wind: gusts, streaks of air, things blown across ----------------------------------

// 0..1, wandering slowly: lulls and gusts.
const gust = now => { const t = now / 1000;
  return Math.max(0, Math.min(1, 0.5 + 0.28 * Math.sin(t * 0.23) + 0.16 * Math.sin(t * 0.71 + 1.7) + 0.08 * Math.sin(t * 1.9 + 4))); };
const windiness = wx => Math.max(0, Math.min(1, (Math.abs(wx.wind_x) - 4) / 8));  // calm below 4 m/s, full at 12

let streaks = [];
function drawStreaks(colour, wx, dt, now) {
  const w = windiness(wx), want = Math.round(22 * w * (0.4 + 0.6 * gust(now)));
  if (streaks.length < want && Math.random() < dt * 9) {
    const fx = Math.random();
    streaks.push({ x: fx, y: rnd(0.04, Math.min(0.85, skyAt(fx) + 0.25)), len: rnd(300, 900), t: 0,
                   dur: rnd(1.6, 3.2), amp: rnd(6, 22), k: rnd(2, 5), ph: rnd(0, 6.3) });
  }
  const u = U(), dir = Math.sign(wx.blow || 1);
  ctx.lineCap = "round";
  streaks = streaks.filter(s => {
    s.t += dt;
    s.x += (wx.blow * 55 * u * dt) / img.w;
    const life = s.t / s.dur;
    if (life >= 1) return false;
    const x0 = X(s.x), y0 = Y(s.y), len = s.len * u;
    const g = ctx.createLinearGradient(x0, 0, x0 - dir * len, 0);
    const a = 0.5 * w * Math.sin(Math.PI * life);
    g.addColorStop(0, rgba(colour, 0)); g.addColorStop(0.3, rgba(colour, a)); g.addColorStop(1, rgba(colour, 0));
    ctx.strokeStyle = g; ctx.lineWidth = 3.2 * u;
    ctx.beginPath();
    for (let i = 0; i <= 24; i++) {  // a long wavy line, like air drawn in a Ghibli film
      const f = i / 24, x = x0 - dir * len * f;
      const y = y0 + Math.sin(f * s.k * Math.PI + s.ph + s.t * 3) * s.amp * u * f;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    return true;
  });
}

// Leaves in autumn, spindrift off the snow in winter, needles otherwise.
const LEAF_COLOURS = { autumn: [[214, 128, 43], [190, 70, 30], [230, 178, 58], [140, 58, 18]] };
let leaves = [];
function makeLeaf(wx, look, anywhere) {
  const dir = Math.sign(wx.blow || 1), z = rnd(0.4, 1);
  const palette = LEAF_COLOURS[look];
  return { x: anywhere ? Math.random() : dir > 0 ? -0.03 : 1.03, y: rnd(0.3, 0.97), z,
           rot: rnd(0, 6.3), spin: rnd(2, 7) * (Math.random() < 0.5 ? -1 : 1), ph: rnd(0, 6.3),
           colour: palette ? palette[Math.floor(Math.random() * palette.length)] : null };
}
function drawLeaves(colour, wx, look, dt, now) {
  const w = windiness(wx), want = Math.round((look === "winter" ? 90 : 45) * w);
  while (leaves.length < want) leaves.push(makeLeaf(wx, look, leaves.length < want / 2));
  if (leaves.length > want) leaves.length = want;
  const u = U(), snow = look === "winter";
  for (const l of leaves) {
    const vx = wx.blow * (snow ? 90 : 70) * u * l.z * (0.7 + 0.6 * gust(now + l.ph * 900));
    const vy = (Math.sin(now / 700 + l.ph) * 60 + (snow ? 6 : 22)) * u * l.z;
    l.x += (vx * dt) / Wd; l.y += (vy * dt) / Ht; l.rot += l.spin * dt;
    if (l.x < -0.05 || l.x > 1.05 || l.y > 1.02 || l.y < 0.2) Object.assign(l, makeLeaf(wx, look, false));
    const x = l.x * Wd, y = l.y * Ht, sz = (snow ? 3 : 13) * u * (0.5 + l.z);
    ctx.globalAlpha = snow ? 0.35 + 0.5 * l.z : 0.85;
    if (snow) {  // a little smear of blown snow
      ctx.strokeStyle = "#fff"; ctx.lineWidth = sz; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - Math.sign(vx) * sz * 5, y - vy * 0.02); ctx.stroke();
    } else {     // a tumbling leaf: flattened ellipse turning over
      ctx.fillStyle = rgba(l.colour || colour, 1);
      ctx.beginPath();
      ctx.ellipse(x, y, sz, sz * 0.45 * Math.abs(Math.cos(l.rot * 0.7)) + 0.4 * u, l.rot, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// --- thunder: branching bolts behind the mountains, sheet lightning in the clouds -------

let storm = null, nextStrike = 0;
const flash = document.getElementById("flash");
function boltPath(x, y, dirX, steps, width) {
  const pts = [[x, y]], branches = [];
  for (let i = 0; i < steps; i++) {
    x += rnd(-0.012, 0.012) + dirX * 0.006; y += rnd(0.012, 0.03);
    pts.push([x, y]);
    if (y > skyAt(Math.max(0, Math.min(1, x))) + 0.02) break;  // gone behind the ridges
    if (width > 1 && Math.random() < 0.14) {
      branches.push(boltPath(x, y, (Math.random() < 0.5 ? -1 : 1) * rnd(1, 2.5), Math.floor(rnd(3, 9)), width * 0.45));
    }
  }
  return { pts, width, branches };
}
function makeStrike(now) {
  // Strike where the sky reaches deep, so the bolt has room before it vanishes behind the ridges.
  const isBolt = Math.random() < 0.6;
  const fx = Array.from({ length: 6 }, () => rnd(0.08, 0.92)).reduce((a, b) => (skyAt(b) > skyAt(a) ? b : a));
  // A few strobes: lightning flickers as it re-strikes down the same channel.
  const pulses = [0];
  for (let i = 1, n = Math.floor(rnd(1, 4)); i <= n; i++) pulses.push(pulses[i - 1] + rnd(70, 190));
  return { t0: now, x: fx, y: rnd(0.05, 0.25), pulses, isBolt,
           bolt: isBolt ? boltPath(fx, rnd(0, 0.05), rnd(-1, 1), 60, 1) : null };
}
function strokeBolt(b, u, a) {
  ctx.lineWidth = Math.max(1.2, b.width * 6 * u);
  ctx.globalAlpha = Math.min(1, a * (b.width < 1 ? 0.7 : 1));
  ctx.beginPath();
  b.pts.forEach(([fx, fy], i) => (i ? ctx.lineTo(X(fx), Y(fy)) : ctx.moveTo(X(fx), Y(fy))));
  ctx.stroke();
  for (const br of b.branches) strokeBolt(br, u, a);
}
function drawThunder(wx, now) {
  if (!wx.thunder) { flash.style.opacity = 0; storm = null; return; }
  if (!storm && now > nextStrike) {
    if (nextStrike) storm = makeStrike(now);
    nextStrike = now + rnd(3500, 14000);
  }
  if (!storm) return;
  const t = now - storm.t0;
  let a = 0;
  for (const p of storm.pulses) if (t >= p) a = Math.max(a, Math.exp(-(t - p) / 70) * (p ? rnd(0.6, 1) : 1));
  if (t > storm.pulses[storm.pulses.length - 1] + 500) { storm = null; flash.style.opacity = 0; return; }
  storm.a = a;
  if (storm.bolt && a > 0.04) {  // drawn inside the sky clip, so it vanishes behind the ridges
    const u = U();
    ctx.globalCompositeOperation = "screen";
    ctx.strokeStyle = "#f4f6ff"; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.shadowColor = "rgba(170,185,255,1)"; ctx.shadowBlur = 40 * u;
    strokeBolt(storm.bolt, u, a);
    ctx.shadowBlur = 0; ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  }
}
// The lit cloud deck around the strike, and the land lighting up for a moment.
function drawThunderGlow() {
  if (!storm || !storm.a) return;
  const a = storm.a, strength = storm.isBolt ? 1 : 0.55;
  ctx.globalCompositeOperation = "screen";
  const cx = X(storm.x), cy = Y(storm.y), r = img.w * 0.35;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, `rgba(215,220,255,${0.6 * a * strength})`);
  g.addColorStop(0.4, `rgba(170,180,240,${0.25 * a * strength})`);
  g.addColorStop(1, "rgba(170,180,240,0)");
  ctx.fillStyle = g; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  ctx.globalCompositeOperation = "source-over";
  flash.style.opacity = (0.32 * a * strength).toFixed(3);
}

// Overcast mutes the colours of the landscape images themselves.
let lastMute = "";
function muteImages(wx) {
  const f = `saturate(${(1 - 0.35 * wx.clouds * (wx.kind ? 1.2 : 1)).toFixed(2)}) brightness(${(1 - 0.1 * wx.clouds - 0.08 * wx.intensity).toFixed(2)})`;
  if (f === lastMute) return;
  lastMute = f;
  for (const p of PHASES) document.getElementById(p).style.filter = f;
}

// --- frame ---------------------------------------------------------------------------

let last = performance.now(), lastSeg = "";
const dbg = document.getElementById("debug");
if (debug) dbg.style.display = "block";

function frame(t) {
  requestAnimationFrame(frame);
  if (!W || t - last < 1000 / fpsCap - 2) return;
  const dt = Math.min(0.2, ((t - last) / 1000) * Math.min(speed, 20));
  last = t;
  const ms = clock(), now = Date.now();  // only the light follows the fast clock; motion stays real-time
  const held = params.get("phase");
  const [a, b, k] = PHASES.includes(held) ? [held, held, 0] : blendAt(ms);

  // Base images: phase a fully shown, phase b fading in on top.
  const seg = `${a}-${b}`;
  if (seg !== lastSeg) {
    for (const p of PHASES) {
      const el = document.getElementById(p);
      el.style.zIndex = p === b && a !== b ? 2 : p === a ? 1 : 0;
      el.style.opacity = p === a ? 1 : 0;
    }
    lastSeg = seg;
  }
  if (a !== b) document.getElementById(b).style.opacity = k;

  const sa = W.scene[a], sb = W.scene[b];
  const look = {};
  for (const key of Object.keys(LOOK.day)) look[key] = mix(LOOK[a][key], LOOK[b][key], k);
  // Weather: clouds hide the sun and stars, rain and snow keep the birds away, fog thickens the mist.
  const wx = currentWeather();
  wx.blow = wx.wind_x * (0.55 + 0.9 * gust(now));  // the wind right now, gusting around its mean
  mistTime += dt * (1 + Math.abs(wx.blow) / 3);
  const look2 = W.look || ({ 12: "winter", 1: "winter", 2: "winter", 3: "winter", 9: "autumn", 10: "autumn", 11: "autumn" })[new Date().getMonth() + 1];
  look.glow *= 1 - 0.8 * wx.clouds;
  look.rays *= 1 - wx.clouds;
  look.stars *= 1 - 0.9 * wx.clouds;
  look.clouds = Math.min(1, look.clouds * (1 + 0.9 * wx.clouds));
  look.mist = Math.max(look.mist, 0.5 * wx.fog + 0.3 * wx.intensity);
  if (wx.kind) look.birds = 0;
  if (W.look === "rain") { look.clouds *= 0.3; look.birds = 0; }  // the image already has its cloud deck
  muteImages(wx);
  const haze = mixRGB(sa.haze, sb.haze, k), sky = mixRGB(sa.sky, sb.sky, k);
  const sun = [0, 1, 2].map(i => mix(sa.sun[i], sb.sun[i], k));
  const glowColour = lighten(mixRGB(haze, [255, 240, 200], 0.4), 0.3);

  ctx.clearRect(0, 0, Wd, Ht);
  drawVeil(mixRGB(sky, wx.thunder ? [90, 95, 115] : [150, 150, 160], 0.6), wx.clouds * wx.clouds * (wx.thunder ? 1.25 : 1));
  ctx.save();
  ctx.clip(skyPath);  // stars and clouds stay behind the mountains
  drawStars(look.stars, now);
  const cloudColour = mixRGB(lighten(mixRGB(sky, haze, 0.6), 0.35), mixRGB(sky, [140, 140, 150], 0.5), 0.55 * wx.clouds);
  drawClouds(cloudColour, look.clouds, dt, wx);
  drawThunder(wx, now);  // the bolt, behind the mountains
  ctx.restore();
  drawThunderGlow();
  drawGlow(sun, glowColour, look.glow, look.rays, now);
  drawMist(lighten(haze, 0.25), look.mist, now);
  drawBirds(darken(sky, 0.75), look.birds, now, dt);
  drawFog(lighten(haze, 0.3), wx.fog);
  drawStreaks(lighten(haze, 0.6), wx, dt, now);
  drawPrecip(lighten(haze, 0.55), wx, dt, now);
  drawLeaves(darken(sky, 0.7), wx, look2, dt, now);

  if (debug) {
    ctx.strokeStyle = "#0f0"; ctx.lineWidth = 2; ctx.stroke(skyPath);
    dbg.textContent = `${new Date(ms).toLocaleTimeString()}  ${a}→${b} ${k.toFixed(2)}  ${W.set}  ` +
      `${wx.symbol || params.get("weather") || ""} clouds ${wx.clouds} ${wx.kind || ""} ${wx.intensity || ""} wind ${wx.wind_x} (now ${wx.blow.toFixed(1)}) ${look2 || ""}`;
  }
}

window.addEventListener("resize", resize);
document.getElementById("day").addEventListener("load", resize);
if (params.get("set")) {  // the gallery's data first, so the first state load can swap in the set
  const g = document.createElement("script");
  g.src = "../gallery/data.js";
  g.onload = g.onerror = loadState;
  document.head.appendChild(g);
} else loadState();
setInterval(loadState, 60000);
(function wait() {
  if (!W) return setTimeout(wait, 100);
  resize();
  clouds = Array.from({ length: 7 }, () => makeCloud());
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
